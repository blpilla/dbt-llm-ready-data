version: 2

seeds:
  - name: clients
    description: Cadastro bruto de clientes recebido como fonte de dados.
    columns:
      - name: client_id
        description: Identificador bruto do cliente.
        tests:
          - not_null:
              config:
                severity: warn
          - unique:
              config:
                severity: warn
      - name: name
        description: Nome informado no cadastro bruto.
        tests:
          - not_null
      - name: city
        description: Cidade informada no cadastro bruto.
        tests:
          - not_null:
              config:
                severity: warn
      - name: state
        description: Sigla do estado do cliente.
        tests:
          - not_null
      - name: created_at
        description: Data de criação do cadastro.
        tests:
          - not_null

  - name: transactions
    description: Transações brutas de compra e venda recebidas como fonte de dados.
    columns:
      - name: transaction_id
        description: Identificador bruto da transação.
        tests:
          - not_null
          - unique
      - name: client_id
        description: Identificador bruto do cliente que realizou a operação.
        tests:
          - not_null:
              config:
                severity: warn
      - name: asset_ticker
        description: Código do ativo negociado.
        tests:
          - not_null
      - name: operation
        description: Tipo bruto da operação.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['BUY', 'SELL']
      - name: quantity
        description: Quantidade bruta negociada.
        tests:
          - not_null
      - name: unit_price
        description: Preço unitário bruto da operação.
        tests:
          - not_null
      - name: transaction_date
        description: Data bruta da operação.
        tests:
          - not_null

models:
  - name: stg_clients
    description: Cadastro de clientes tipado, normalizado e deduplicado na camada de staging (priorizando registros completos).
    columns:
      - name: client_id
        description: Identificador único do cliente após deduplicação determinística.
        tests:
          - not_null
          - unique
      - name: name
        description: Nome normalizado do cliente.
        tests:
          - not_null
      - name: city
        description: Cidade normalizada do cliente (selecionada do cadastro mais completo).
        tests:
          - not_null
      - name: state
        description: Sigla do estado normalizada em letras maiúsculas.
        tests:
          - not_null
      - name: created_at
        description: Data de criação do cadastro, tipada como date.
        tests:
          - not_null

  - name: stg_transactions
    description: Transações tipadas, normalizadas e filtradas para remover registros sem chave ou com valores inválidos.
    columns:
      - name: transaction_id
        description: Identificador único da transação.
        tests:
          - not_null
          - unique
      - name: client_id
        description: Identificador do cliente associado à transação.
        tests:
          - not_null
      - name: asset_ticker
        description: Código do ativo em letras maiúsculas.
        tests:
          - not_null
      - name: operation
        description: Operação normalizada.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['BUY', 'SELL']
      - name: quantity
        description: Quantidade positiva negociada.
        tests:
          - not_null
      - name: unit_price
        description: Preço unitário positivo, tipado como decimal.
        tests:
          - not_null
      - name: transaction_date
        description: Data da transação, tipada como date.
        tests:
          - not_null

  - name: dim_clients
    description: Dimensão deduplicada de clientes; quando há mais de um cadastro, prioriza o registro mais completo.
    columns:
      - name: client_id
        description: Chave da dimensão de clientes.
        tests:
          - not_null
          - unique
      - name: name
        description: Nome do cliente.
        tests:
          - not_null
      - name: city
        description: Cidade do cliente, escolhida do cadastro mais completo.
        tests:
          - not_null
      - name: state
        description: Estado do cliente.
        tests:
          - not_null
      - name: created_at
        description: Data de criação do cadastro.
        tests:
          - not_null

  - name: int_transactions
    description: Transações válidas enriquecidas com atributos do cliente e métricas assinadas pela operação.
    columns:
      - name: transaction_id
        description: Identificador da transação.
        tests:
          - not_null
          - unique
      - name: client_id
        description: Identificador do cliente.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_clients')
                field: client_id
      - name: client_name
        description: Nome do cliente associado.
        tests:
          - not_null
      - name: city
        description: Cidade do cliente associado.
        tests:
          - not_null
      - name: state
        description: Estado do cliente associado.
        tests:
          - not_null
      - name: asset_ticker
        description: Código do ativo.
        tests:
          - not_null
      - name: operation
        description: Operação de compra ou venda.
        tests:
          - accepted_values:
              arguments:
                values: ['BUY', 'SELL']
      - name: operation_sign
        description: Sinal numérico da operação, 1 para compra e -1 para venda.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, -1]
      - name: quantity
        description: Quantidade positiva da operação.
        tests:
          - not_null
      - name: unit_price
        description: Preço unitário da operação.
        tests:
          - not_null
      - name: gross_value
        description: Valor financeiro absoluto da operação.
        tests:
          - not_null
      - name: signed_quantity
        description: Quantidade com sinal da operação.
        tests:
          - not_null
      - name: signed_value
        description: Valor financeiro com sinal da operação.
        tests:
          - not_null
      - name: transaction_date
        description: Data da operação.
        tests:
          - not_null

  - name: fact_transactions
    description: Fato incremental de transações válidas, enriquecidas e com métricas assinadas.
    columns:
      - name: transaction_id
        description: Chave única da transação.
        tests:
          - not_null
          - unique
      - name: client_id
        description: Chave do cliente (FK para dim_clients).
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_clients')
                field: client_id
      - name: client_name
        description: Nome do cliente no momento da transformação.
        tests:
          - not_null
      - name: city
        description: Cidade do cliente.
        tests:
          - not_null
      - name: state
        description: Estado do cliente.
        tests:
          - not_null
      - name: asset_ticker
        description: Código do ativo negociado.
        tests:
          - not_null
      - name: operation
        description: Tipo de operação.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['BUY', 'SELL']
      - name: operation_sign
        description: Sinal da operação.
        tests:
          - not_null
      - name: quantity
        description: Quantidade positiva negociada.
        tests:
          - not_null
      - name: unit_price
        description: Preço unitário.
        tests:
          - not_null
      - name: gross_value
        description: Valor financeiro absoluto.
        tests:
          - not_null
      - name: signed_quantity
        description: Quantidade assinada para cálculo de posição.
        tests:
          - not_null
      - name: signed_value
        description: Valor financeiro assinado para cálculo de posição.
        tests:
          - not_null
      - name: transaction_date
        description: Data da transação usada também como controle incremental.
        tests:
          - not_null

  - name: mart_client_portfolio
    description: Posição líquida por cliente e ativo, calculada a partir das transações da fato.
    columns:
      - name: client_id
        description: Identificador do cliente.
        tests:
          - not_null
      - name: client_name
        description: Nome do cliente.
        tests:
          - not_null
      - name: asset_ticker
        description: Código do ativo.
        tests:
          - not_null
      - name: net_quantity
        description: Quantidade líquida, calculada como compras menos vendas.
        tests:
          - not_null
      - name: net_financial_value
        description: Valor financeiro líquido, com compras positivas e vendas negativas.
        tests:
          - not_null
      - name: first_transaction_date
        description: Data da primeira transação do cliente para o ativo.
        tests:
          - not_null
      - name: last_transaction_date
        description: Data da última transação do cliente para o ativo.
        tests:
          - not_null
      - name: transaction_count
        description: Quantidade de transações consideradas na posição.
        tests:
          - not_null
    tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [client_id, asset_ticker]
